<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f2e9">
  <meta name="description" content="Discover ten shopping worlds at EdgeMart AI.">
  <title>Your world, with an edge — EdgeMart AI</title>

  <link rel="icon" href="/logo.svg" type="image/svg+xml">

  <!-- Point directly to your style file in src/styles/ -->
  <link rel="stylesheet" href="/src/styles/landing.css">
</head>
<body>
  <div id="root">
    <!-- If your landing page HTML is statically hosted inside index.html -->
    <main>
      <div class="department-grid">
        <!-- 1. Electronics -->
        <article class="department-card">
          <img src="/images/hero-electronics.jpg" alt="Electronics collection">
        </article>

        <!-- 2. Fruits -->
        <article class="department-card">
          <img src="/images/hero-fruits.jpg" alt="Fruits collection">
        </article>

        <!-- 3. Vegetables -->
        <article class="department-card">
          <img src="/images/hero-vegetables.jpg" alt="Vegetables collection">
        </article>

        <!-- 4. Jewellery -->
        <article class="department-card">
          <img src="/images/hero-jewellery.jpg" alt="Jewellery collection">
        </article>

        <!-- 5. Meat -->
        <article class="department-card">
          <img src="/images/hero-meat.jpg" alt="Meat & Poultry collection">
        </article>

        <!-- 6. Pharmacy -->
        <article class="department-card">
          <img src="/images/hero-pharmacy.jpg" alt="Pharmacy collection">
        </article>

        <!-- 7. Groceries -->
        <article class="department-card">
          <img src="/images/hero-groceries.jpg" alt="Groceries collection">
        </article>

        <!-- 8. Books -->
        <article class="department-card">
          <img src="/images/hero-books.jpg" alt="Books collection">
        </article>

        <!-- 9. Food -->
        <article class="department-card">
          <img src="/images/hero-food.jpg" alt="Prepared Food collection">
        </article>

        <!-- 10. Plants -->
        <article class="department-card">
          <img src="/images/hero-plants.jpg" alt="Plants & Garden collection">
        </article>
      </div>
    </main>
  </div>

  <!-- Vite React Entry -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
